<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Meta HQ · Classroom Stage power distribution plan">
  <rect width="1600" height="1000" fill="#1C1E21"/>
  <g stroke="#0A58CA" stroke-width=".4" opacity=".5">
    <g><line x1="0" y1="100" x2="1600" y2="100"/><line x1="0" y1="200" x2="1600" y2="200"/><line x1="0" y1="300" x2="1600" y2="300"/><line x1="0" y1="400" x2="1600" y2="400"/><line x1="0" y1="500" x2="1600" y2="500"/><line x1="0" y1="600" x2="1600" y2="600"/><line x1="0" y1="700" x2="1600" y2="700"/><line x1="0" y1="800" x2="1600" y2="800"/><line x1="0" y1="900" x2="1600" y2="900"/></g>
    <g><line x1="200" y1="0" x2="200" y2="1000"/><line x1="400" y1="0" x2="400" y2="1000"/><line x1="600" y1="0" x2="600" y2="1000"/><line x1="800" y1="0" x2="800" y2="1000"/><line x1="1000" y1="0" x2="1000" y2="1000"/><line x1="1200" y1="0" x2="1200" y2="1000"/><line x1="1400" y1="0" x2="1400" y2="1000"/></g>
  </g>
  <!-- building outline -->
  <rect x="200" y="130" width="1200" height="760" fill="none" stroke="#0866FF" stroke-width="3"/>
  <!-- stage -->
  <rect x="500" y="320" width="600" height="260" fill="none" stroke="#4B4F56" stroke-dasharray="4 4"/>
  <text x="800" y="356" text-anchor="middle" fill="#4B4F56" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13">CLASSROOM STAGE</text>
  <!-- utility tie-in from building (bus A) -->
  <g stroke="#1E7B34" stroke-width="3" fill="none" stroke-dasharray="12 6">
    <path d="M200 450 L300 450 L300 700 L470 700"/>
  </g>
  <!-- 400A A distro -->
  <g fill="#1E7B34">
    <rect x="470" y="680" width="60" height="40" rx="4"/>
  </g>
  <text x="500" y="704" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">A·400A</text>
  <text x="500" y="748" text-anchor="middle" fill="#1E7B34" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">BUS A · UTILITY</text>
  <!-- gen tie-in (bus B) -->
  <g stroke="#F7B928" stroke-width="3" fill="none" stroke-dasharray="12 6">
    <path d="M1400 450 L1300 450 L1300 700 L1130 700"/>
  </g>
  <g fill="#F7B928">
    <rect x="1070" y="680" width="60" height="40" rx="4"/>
  </g>
  <text x="1100" y="704" text-anchor="middle" fill="#1C1E21" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">B·400A</text>
  <text x="1100" y="748" text-anchor="middle" fill="#F7B928" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">BUS B · GEN STANDBY</text>
  <!-- generator (outside building) -->
  <rect x="1440" y="430" width="100" height="60" fill="#242526" stroke="#F7B928"/>
  <text x="1490" y="454" text-anchor="middle" fill="#F7B928" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">GEN</text>
  <text x="1490" y="476" text-anchor="middle" fill="#F7B928" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">500 kW</text>
  <!-- ATS -->
  <g fill="#88a8ff">
    <polygon points="800,760 820,760 840,800 820,840 800,840 780,800"/>
  </g>
  <text x="810" y="806" text-anchor="middle" fill="#1C1E21" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">ATS</text>
  <!-- distro to subs: Grip, Cam, Audio, GFX -->
  <g stroke="#F5A3B1" stroke-width="1.6" fill="none">
    <path d="M530 700 L800 700 L800 760"/>
    <path d="M1070 700 L820 700 L820 760"/>
    <path d="M530 700 L530 430 L540 430"/>
    <path d="M1070 700 L1070 430 L1060 430"/>
    <path d="M820 840 L820 880 L540 880 L540 860"/>
    <path d="M820 840 L820 880 L1060 880 L1060 860"/>
  </g>
  <!-- sub-distros -->
  <g fill="#E41E3F">
    <rect x="510" y="400" width="60" height="30" rx="3"/>
    <rect x="1030" y="400" width="60" height="30" rx="3"/>
    <rect x="510" y="830" width="60" height="30" rx="3"/>
    <rect x="1030" y="830" width="60" height="30" rx="3"/>
  </g>
  <g fill="#FFFFFF" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" text-anchor="middle">
    <text x="540" y="420">LIGHT</text><text x="1060" y="420">CAM</text>
    <text x="540" y="850">AUDIO</text><text x="1060" y="850">GFX</text>
  </g>
  <g fill="#F5A3B1" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="10" text-anchor="middle">
    <text x="540" y="388">100A · 3Φ</text><text x="1060" y="388">60A · 3Φ</text>
    <text x="540" y="880">60A · 3Φ</text><text x="1060" y="880">60A · 3Φ</text>
  </g>
  <!-- UPS -->
  <rect x="300" y="200" width="80" height="40" fill="#0866FF"/>
  <text x="340" y="226" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">UPS 8 kVA</text>
  <path d="M380 220 L540 220 L540 400" stroke="#88a8ff" stroke-width="1.4" fill="none"/>
  <!-- legend -->
  <g transform="translate(60,920)" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#FFFFFF">
    <g><rect x="0" y="0" width="14" height="14" fill="#1E7B34"/><text x="20" y="12">UTILITY · BUS A</text></g>
    <g transform="translate(170,0)"><rect x="0" y="0" width="14" height="14" fill="#F7B928"/><text x="20" y="12" fill="#F7B928">GEN · BUS B</text></g>
    <g transform="translate(320,0)"><rect x="0" y="0" width="14" height="14" fill="#E41E3F"/><text x="20" y="12" fill="#F5A3B1">SUB-DISTRO</text></g>
    <g transform="translate(500,0)"><rect x="0" y="0" width="14" height="14" fill="#0866FF"/><text x="20" y="12" fill="#88a8ff">UPS</text></g>
  </g>
  <!-- title block -->
  <g transform="translate(1140,920)">
    <rect width="340" height="60" fill="#242526" stroke="#88a8ff"/>
    <text x="12" y="22" fill="#F5F7FA" font-family="system-ui,sans-serif" font-size="14" font-weight="700">META HQ · CLASSROOM STAGE</text>
    <text x="12" y="42" fill="#88a8ff" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">POWER DISTRIBUTION · A/B · REV 2.0</text>
  </g>
</svg>
