<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Meta HQ · Classroom Stage general plan">
  <rect width="1600" height="1000" fill="#1C1E21"/>
  <!-- grid -->
  <g stroke="#0A58CA" stroke-width=".4" opacity=".55">
    <g>
      <line x1="0" y1="100" x2="1600" y2="100"/><line x1="0" y1="200" x2="1600" y2="200"/>
      <line x1="0" y1="300" x2="1600" y2="300"/><line x1="0" y1="400" x2="1600" y2="400"/>
      <line x1="0" y1="500" x2="1600" y2="500"/><line x1="0" y1="600" x2="1600" y2="600"/>
      <line x1="0" y1="700" x2="1600" y2="700"/><line x1="0" y1="800" x2="1600" y2="800"/>
      <line x1="0" y1="900" x2="1600" y2="900"/>
    </g>
    <g>
      <line x1="100" y1="0" x2="100" y2="1000"/><line x1="300" y1="0" x2="300" y2="1000"/>
      <line x1="500" y1="0" x2="500" y2="1000"/><line x1="700" y1="0" x2="700" y2="1000"/>
      <line x1="900" y1="0" x2="900" y2="1000"/><line x1="1100" y1="0" x2="1100" y2="1000"/>
      <line x1="1300" y1="0" x2="1300" y2="1000"/><line x1="1500" y1="0" x2="1500" y2="1000"/>
    </g>
  </g>
  <!-- grid axis labels -->
  <g fill="#0A58CA" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" opacity=".9">
    <text x="110" y="26">A</text><text x="310" y="26">B</text><text x="510" y="26">C</text>
    <text x="710" y="26">D</text><text x="910" y="26">E</text><text x="1110" y="26">F</text>
    <text x="1310" y="26">G</text><text x="1510" y="26">H</text>
    <text x="12" y="112">1</text><text x="12" y="212">2</text><text x="12" y="312">3</text>
    <text x="12" y="412">4</text><text x="12" y="512">5</text><text x="12" y="612">6</text>
    <text x="12" y="712">7</text><text x="12" y="812">8</text><text x="12" y="912">9</text>
  </g>
  <!-- building outline -->
  <rect x="200" y="130" width="1200" height="760" fill="none" stroke="#0866FF" stroke-width="3"/>
  <!-- stage platform -->
  <rect x="500" y="320" width="600" height="260" fill="#242526" stroke="#88a8ff" stroke-width="1.6"/>
  <text x="800" y="360" text-anchor="middle" fill="#88a8ff" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" letter-spacing=".12em">CLASSROOM STAGE · PAD</text>
  <!-- LED wall -->
  <rect x="520" y="340" width="560" height="60" fill="#0064E0" stroke="#88a8ff"/>
  <text x="800" y="378" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12">LED BACK WALL · 28 FT × 10 FT</text>
  <!-- truss ring -->
  <rect x="480" y="300" width="640" height="300" fill="none" stroke="#F7B928" stroke-dasharray="8 6" stroke-width="1.2"/>
  <text x="800" y="294" text-anchor="middle" fill="#F7B928" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" letter-spacing=".12em">TRUSS GRID · 32 FT TRIM</text>
  <!-- cam positions -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#FFFFFF" text-anchor="middle">
    <g fill="#0866FF" stroke="#88a8ff" stroke-width="1.4">
      <rect x="340" y="620" width="52" height="36" rx="4"/><rect x="784" y="640" width="52" height="36" rx="4"/><rect x="1208" y="620" width="52" height="36" rx="4"/>
    </g>
    <text x="366" y="642" fill="#FFFFFF">C1</text><text x="810" y="662" fill="#FFFFFF">C2</text><text x="1234" y="642" fill="#FFFFFF">C3</text>
    <!-- jib -->
    <g fill="#F7B928"><rect x="784" y="820" width="52" height="36" rx="4"/></g>
    <text x="810" y="842" fill="#1C1E21">JIB</text>
  </g>
  <!-- audience area -->
  <path d="M240 650 L1360 650 L1360 870 L240 870 Z" fill="none" stroke="#4B4F56" stroke-dasharray="4 4"/>
  <text x="800" y="780" text-anchor="middle" fill="#65676B" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" opacity=".9">SEATING · 320 CAP · 8 ROWS × 40</text>
  <!-- entry -->
  <rect x="760" y="880" width="80" height="20" fill="#242526" stroke="#88a8ff"/>
  <text x="800" y="936" text-anchor="middle" fill="#88a8ff" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">MAIN ENTRY</text>
  <!-- compass + scale -->
  <g transform="translate(1500,920)" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#88a8ff" text-anchor="middle">
    <circle r="24" fill="none" stroke="#88a8ff"/>
    <path d="M0 -18 L6 8 L0 4 L-6 8 Z" fill="#E41E3F"/>
    <text y="-28">N</text>
  </g>
  <g transform="translate(60,920)" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#88a8ff">
    <rect width="200" height="4" fill="#88a8ff"/>
    <rect x="50" width="50" height="4" fill="#1C1E21" stroke="#88a8ff"/>
    <text x="0" y="24">0 ft</text><text x="200" y="24">40 ft</text>
    <text x="100" y="24" text-anchor="middle">SCALE 1:48</text>
  </g>
  <!-- title block -->
  <g transform="translate(1140,920)">
    <rect width="340" height="60" fill="#242526" stroke="#88a8ff"/>
    <text x="12" y="22" fill="#F5F7FA" font-family="system-ui,sans-serif" font-size="14" font-weight="700">META HQ · CLASSROOM STAGE</text>
    <text x="12" y="42" fill="#88a8ff" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11">GENERAL PLAN · REV 2.0 · JUN 2026</text>
  </g>
</svg>
