<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="t d">
  <title id="t">Muse Live architecture</title>
  <desc id="d">The browser app talks over HTTPS to Cloudflare Pages. Pages Functions handle auth, the Muse agent step, shared storage and telemetry adapters, and call Workers KV, Meta Model API, AWS CloudWatch, Mux Data and the Facebook Graph API.</desc>
  <style>
    .bg{fill:#FFFFFF}
    .box{fill:#F5F6F7;stroke:#DADDE1;stroke-width:1.5}
    .hot{fill:#EEF4FF;stroke:#0866FF;stroke-width:1.5}
    .t{fill:#050505;font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .s{fill:#4B4F56;font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .h{fill:#0064E0;font:700 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:.08em}
    .ln{stroke:#8A8D91;stroke-width:1.5;fill:none}
    .ah{fill:#8A8D91}
  </style>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0 0L10 5L0 10z"/></marker></defs>
  <rect class="bg" x="0" y="0" width="960" height="420" rx="16"/>
  <text class="h" x="20" y="38">BROWSER</text>
  <rect class="box" x="20" y="50" width="260" height="340" rx="12"/>
  <text class="t" x="40" y="82">App shell + feature modules</text>
  <text class="s" x="40" y="102">streaming · incidents · finance · Omni</text>
  <text class="s" x="40" y="120">productions · techbook · schedule</text>
  <text class="t" x="40" y="160">Muse agent (tools run here)</text>
  <text class="s" x="40" y="180">reads the live plan of record,</text>
  <text class="s" x="40" y="198">Confirm cards for every write</text>
  <text class="t" x="40" y="238">hls.js monitors</text>
  <text class="s" x="40" y="258">QoE beacons: startup, rebuffer,</text>
  <text class="s" x="40" y="276">bitrate switches, errors</text>
  <text class="t" x="40" y="316">MuseSync</text>
  <text class="s" x="40" y="336">localStorage ⇄ KV, offline queue,</text>
  <text class="s" x="40" y="354">“Updated elsewhere” detection</text>
  <path class="ln" d="M282 215 H346" marker-end="url(#a)" marker-start="url(#a)"/>
  <text class="s" x="292" y="206">HTTPS</text>
  <text class="h" x="350" y="38">CLOUDFLARE PAGES (EDGE)</text>
  <rect class="hot" x="350" y="50" width="290" height="340" rx="12"/>
  <text class="t" x="370" y="82">_middleware</text>
  <text class="s" x="370" y="102">HMAC sessions · roles · guest demo</text>
  <text class="s" x="370" y="120">login throttle · CSP via _headers</text>
  <text class="t" x="370" y="160">/api/museai</text>
  <text class="s" x="370" y="180">one model step per call, streamed;</text>
  <text class="s" x="370" y="198">rate limits + daily token budgets</text>
  <text class="t" x="370" y="238">/api/kv · /api/calendar · /api/audit</text>
  <text class="s" x="370" y="258">shared state, ICS feeds, audit log</text>
  <text class="t" x="370" y="298">/api/telemetry · /api/qoe · /api/fblive</text>
  <text class="s" x="370" y="318">SigV4 CloudWatch, Mux Data,</text>
  <text class="s" x="370" y="336">Graph API: keys stay server-side</text>
  <path class="ln" d="M642 100 H706" marker-end="url(#a)"/>
  <path class="ln" d="M642 175 H706" marker-end="url(#a)"/>
  <path class="ln" d="M642 250 H706" marker-end="url(#a)"/>
  <path class="ln" d="M642 310 H706" marker-end="url(#a)"/>
  <text class="h" x="710" y="38">SERVICES</text>
  <rect class="box" x="710" y="68" width="230" height="58" rx="10"/>
  <text class="t" x="728" y="93">Workers KV</text><text class="s" x="728" y="112">shared state, users, audit</text>
  <rect class="box" x="710" y="144" width="230" height="58" rx="10"/>
  <text class="t" x="728" y="169">Meta Model API</text><text class="s" x="728" y="188">muse-spark, tool calling</text>
  <rect class="box" x="710" y="220" width="230" height="58" rx="10"/>
  <text class="t" x="728" y="245">AWS CloudWatch · Mux Data</text><text class="s" x="728" y="264">MediaLive, MediaConnect, CDN</text>
  <rect class="box" x="710" y="296" width="230" height="58" rx="10"/>
  <text class="t" x="728" y="321">Facebook Graph API</text><text class="s" x="728" y="340">Live video + ingest health</text>
</svg>
