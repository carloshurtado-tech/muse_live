<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1024" width="2048" height="1024" role="img" aria-label="Classroom Stage — 360 equirectangular planographic view">
  <defs>
    <linearGradient id="ceiling" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#242526"/><stop offset="1" stop-color="#3E4042"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4B4F56"/><stop offset="1" stop-color="#1C1E21"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0064E0"/><stop offset="1" stop-color="#00C2FF"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0064E0"/><stop offset=".55" stop-color="#0082FB"/><stop offset="1" stop-color="#00C2FF"/>
    </linearGradient>
  </defs>
  <!-- ceiling -->
  <rect width="2048" height="420" fill="url(#ceiling)"/>
  <!-- grid trussing suggestion -->
  <g stroke="#88a8ff" stroke-width="1" opacity=".4">
    <path d="M0 180 L2048 180"/><path d="M0 240 L2048 240"/><path d="M0 300 L2048 300"/>
    <g stroke-dasharray="4 10">
      <path d="M160 0 L160 420"/><path d="M480 0 L480 420"/><path d="M800 0 L800 420"/>
      <path d="M1120 0 L1120 420"/><path d="M1440 0 L1440 420"/><path d="M1760 0 L1760 420"/>
    </g>
  </g>
  <!-- fixtures -->
  <g fill="#F7B928" opacity=".9">
    <circle cx="320" cy="220" r="10"/><circle cx="640" cy="220" r="10"/>
    <circle cx="960" cy="220" r="10"/><circle cx="1280" cy="220" r="10"/><circle cx="1600" cy="220" r="10"/>
  </g>
  <!-- floor -->
  <rect y="620" width="2048" height="404" fill="url(#floor)"/>
  <!-- horizon marker -->
  <path d="M0 620 L2048 620" stroke="#88a8ff" stroke-width="1" stroke-dasharray="20 10" opacity=".55"/>
  <!-- back wall LED screen (hero element) -->
  <rect x="640" y="420" width="768" height="200" fill="url(#screen)"/>
  <rect x="640" y="420" width="768" height="200" fill="none" stroke="#88a8ff" stroke-width="2"/>
  <!-- Meta ∞ on LED -->
  <g transform="translate(880,460) scale(.5)">
    <path fill="#FFFFFF" d="m31.06,125.96c0,10.98 2.41,19.41 5.56,24.51 4.13,6.68 10.29,9.51 16.57,9.51 8.1,0 15.51-2.01 29.79-21.76 11.44-15.83 24.92-38.05 33.99-51.98l15.36-23.6c10.67-16.39 23.02-34.61 37.18-46.96 11.56-10.08 24.03-15.68 36.58-15.68 21.07,0 41.14,12.21 56.5,35.11 16.81,25.08 24.97,56.67 24.97,89.27 0,19.38-3.82,33.62-10.32,44.87-6.28,10.88-18.52,21.75-39.11,21.75l0-31.02c17.63,0 22.03-16.2 22.03-34.74 0-26.42-6.16-55.74-19.73-76.69-9.63-14.86-22.11-23.94-35.84-23.94-14.85,0-26.8,11.2-40.23,31.17-7.14,10.61-14.47,23.54-22.7,38.13l-9.06,16.05c-18.2,32.27-22.81,39.62-31.91,51.75-15.95,21.24-29.57,29.29-47.5,29.29-21.27,0-34.72-9.21-43.05-23.09-6.8-11.31-10.14-26.15-10.14-43.06z"/>
  </g>
  <text x="1024" y="596" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" opacity=".85">RAY-BAN META GEN 3 · LIVE</text>
  <!-- side wall panels -->
  <rect x="40" y="440" width="520" height="180" fill="#242526" stroke="#55575B"/>
  <rect x="1488" y="440" width="520" height="180" fill="#242526" stroke="#55575B"/>
  <text x="300" y="536" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#88a8ff">HOUSE LEFT · WALL B</text>
  <text x="1748" y="536" text-anchor="middle" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="12" fill="#88a8ff">HOUSE RIGHT · WALL C</text>
  <!-- camera positions overlay (on floor) -->
  <g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#FFFFFF" text-anchor="middle">
    <circle cx="420" cy="720" r="18" fill="#0866FF" stroke="#FFFFFF" stroke-width="2"/><text x="420" y="724">C1</text>
    <circle cx="1024" cy="700" r="18" fill="#0866FF" stroke="#FFFFFF" stroke-width="2"/><text x="1024" y="704">C2</text>
    <circle cx="1628" cy="720" r="18" fill="#0866FF" stroke="#FFFFFF" stroke-width="2"/><text x="1628" y="724">C3</text>
    <circle cx="1024" cy="900" r="18" fill="#F7B928" stroke="#FFFFFF" stroke-width="2"/><text x="1024" y="904">JIB</text>
  </g>
  <!-- audience area -->
  <path d="M0 820 L2048 820 L2048 1024 L0 1024 Z" fill="#1C1E21"/>
  <g fill="#55575B">
    <g>
      <rect x="60" y="830" width="520" height="4"/><rect x="60" y="860" width="520" height="4"/>
      <rect x="60" y="890" width="520" height="4"/><rect x="60" y="920" width="520" height="4"/>
      <rect x="60" y="950" width="520" height="4"/><rect x="60" y="980" width="520" height="4"/>
    </g>
    <g transform="translate(760,0)">
      <rect x="60" y="830" width="520" height="4"/><rect x="60" y="860" width="520" height="4"/>
      <rect x="60" y="890" width="520" height="4"/><rect x="60" y="920" width="520" height="4"/>
      <rect x="60" y="950" width="520" height="4"/><rect x="60" y="980" width="520" height="4"/>
    </g>
    <g transform="translate(1388,0)">
      <rect x="60" y="830" width="520" height="4"/><rect x="60" y="860" width="520" height="4"/>
      <rect x="60" y="890" width="520" height="4"/><rect x="60" y="920" width="520" height="4"/>
      <rect x="60" y="950" width="520" height="4"/><rect x="60" y="980" width="520" height="4"/>
    </g>
  </g>
  <!-- caption bar top-left -->
  <g transform="translate(40,40)">
    <rect width="520" height="88" rx="14" fill="#FFFFFF" opacity=".94" stroke="#CED0D4"/>
    <text x="24" y="34" font-family="system-ui,sans-serif" font-size="13" font-weight="700" letter-spacing=".08em" fill="#65676B">360 · EQUIRECTANGULAR</text>
    <text x="24" y="62" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#1C1E21">Classroom Stage interior · Meta HQ</text>
    <text x="24" y="80" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#8A8D91">LED back wall · 3 hard-cam + jib · side-fill</text>
  </g>
  <!-- spectrum sweep base -->
  <rect x="0" y="1020" width="2048" height="4" fill="url(#sweep)"/>
