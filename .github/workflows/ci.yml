name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · typecheck · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Bundles rebuild cleanly
        run: node scripts/build.mjs --out /tmp/build
      - name: Committed bundles match their sources
        run: for n in a b; do cmp /tmp/build/muse-app-$n.min.js js/muse-app-$n.min.js || { echo "js/muse-app-$n.min.js is stale — run npm run build and commit"; exit 1; }; done

  e2e:
    name: End-to-end (${{ matrix.browser }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { browser: [chromium, firefox] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test -c tests/e2e/playwright.config.mjs --project=${{ matrix.browser }}
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report
          retention-days: 7
